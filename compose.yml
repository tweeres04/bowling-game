services:
  bowling-game:
    build: .
    container_name: bowling-game
    restart: unless-stopped
    # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET. Kept on the server only,
    # never committed.
    env_file: .env
    volumes:
      - ./database:/app/database
    environment:
      DATABASE_URL: file:./database/bowling-game.db
      MIXPANEL_TOKEN: dfb35a193d912ca49e27b46ca25e9aed

networks:
  default:
    external: true
    name: proxy
